pre-commit:
  commands:
    format:
      glob: "*.{ts,tsx,js,jsx,json,jsonc,css,html,md,yml,yaml}"
      run: pnpm exec oxfmt --check {staged_files}
    lint:
      glob: "*.{ts,tsx,js,jsx}"
      run: pnpm exec oxlint --deny-warnings {staged_files}

pre-push:
  commands:
    typecheck:
      run: pnpm typecheck
